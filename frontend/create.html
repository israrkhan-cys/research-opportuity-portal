<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New opportunity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Putting a Navigation Bar at the top of the page-->
    <nav class="navbar">
        <div class="logo">Research Opportunities Portal</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="view.html">View Opportunities</a></li>
            <li><a href="create.html">Create Opportunity</a></li>
        </ul>
    </nav>

    <!--Putting a Navigation Bar at the top of the page-->
    </nav>  
    <div class="container">
        <h1>Create New Opportunity</h1>
        <form>
            <label for="title">Research Title:</label>
            <input type="text" id="title" name="title" required>
            <label for="description">Research Description:</label>
            <textarea id="description" name="description" required></textarea>  
            <label for="area">Research Area:</label>
            <input type="text" id="area" name="area" required>
            <label for="faculty">Faculty Name:</label>
            <input type="text" id="faculty" name="faculty" required>
            <label for="department">Department:</label>
            <input type="text" id="department" name="department" required>
            <label for="skills">Required Skills:</label>
            <input type="text" id="skills" name="skills" required>  
            <label for="positions">Available Positions:</label>
            <input type="number" id="positions" name="positions" required>
            <label for="deadline">Application Deadline:</label>
            <input type="date" id="deadline" name="deadline" required>
            <label for="status">Status:</label>
             <select name="status" id="status">
                <option value="open">Open</option>
                <option value="closed">Closed</option>
            </select>
            <button type="submit">Create Opportunity</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
